#:schema ./schema.json
# Atlas provider profile: what Atlas knows about one kind of LLM provider.
# Every field: docs/llm.md, "Provider profiles", and provider_profiles/schema.json.
# To change a field, put a file of the same name in provider_profiles.local/
# (`atlas provider profile init <id>` copies this one there) and keep only the
# lines you change: the rest, and later fixes to them, come from this file.
# A file there fails when its id is not its file name, when it sets [env] or
# implicit, or when it is named custom.toml (the fallback cannot be changed).
# Source: https://lmstudio.ai/docs/developer/openai-compat
# Format version of this file; leave it at 1.
schema = 1
# Must equal the file name without .toml.
id = "lmstudio"
# Position in the setup menu; lower comes first.
order = 122
# Name shown in the setup menu and on the Settings page.
label = "LM Studio"
# One line shown under the label in the menu.
description = "A local LM Studio server through its OpenAI-compatible endpoint."
# Shown when this profile is chosen: what to know before saving.
notes = "Start the server in LM Studio; the port is the one it shows (1234 unless changed). No key is needed."
# How these facts were checked: "live", "docs" (vendor documentation only) or "" (no fixed endpoint).
evidence = "docs"
# Wire format: "chat" (Chat Completions), "responses" (OpenAI Responses) or "messages" (Anthropic Messages).
dialect = "chat"
# false for a server that takes no key: no auth header is sent and no key is asked for.
needs_api_key = false

[connection]
# Prefills the base URL field; a provider uses the URL saved with it.
base_url = "http://localhost:1234/v1"
