<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Atlas · Reset password</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="assets/atlas.css" />
<script src="assets/i18n.js"></script>
<style>
  /* View-specific layout only — all tokens/components come from atlas.css. */
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .auth-card {
    width: 340px; background: var(--bg-2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px 26px;
  }
  .auth-brand {
    font-size: var(--fs-title); font-weight: 600; margin: 0 0 4px;
    color: var(--fg-0);
  }
  .auth-sub { color: var(--fg-1); font-size: var(--fs-small); margin: 0 0 20px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: var(--fs-label); color: var(--fg-1);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: .03em;
  }
  .field input { width: 100%; box-sizing: border-box; }
  .auth-submit { width: 100%; margin-top: 6px; }
  .auth-error, .auth-notice {
    font-size: var(--fs-small); margin: 0 0 14px; display: none;
  }
  .auth-error { color: var(--bad); }
  .auth-notice { color: var(--ok); }
  .auth-error.show, .auth-notice.show { display: block; }
  .auth-links { margin-top: 16px; font-size: var(--fs-small); text-align: center; }
  .auth-links a { color: var(--accent); text-decoration: none; }
  .auth-links a:hover { text-decoration: underline; }
  .auth-controls {
    position: fixed; top: 14px; right: 16px; display: flex; gap: 8px;
  }
  .auth-controls button, .auth-controls select {
    background: var(--bg-2); border: 1px solid var(--border); color: var(--fg-1);
    border-radius: var(--radius-sm); padding: 5px 9px; font-size: var(--fs-small);
    cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>
<div class="auth-controls">
  <button id="auth-theme-toggle"></button>
  <select id="auth-lang-select">
    <option value="en">EN</option>
    <option value="de">DE</option>
  </select>
</div>
<div class="auth-card">
  <p class="auth-brand" id="auth-brand">Atlas</p>
  <p class="auth-sub" id="auth-sub"></p>
  <p class="auth-error" id="auth-error"></p>
  <p class="auth-notice" id="auth-notice"></p>

  <form id="request-form">
    <div class="field">
      <label for="f-email" id="label-email">Email</label>
      <input type="email" id="f-email" autocomplete="email" required />
    </div>
    <button type="submit" class="btn ok auth-submit" id="request-submit"></button>
  </form>

  <form id="confirm-form" style="display:none">
    <div class="field">
      <label for="f-password" id="label-password">New password</label>
      <input type="password" id="f-password" autocomplete="new-password" required minlength="8" />
    </div>
    <div class="field">
      <label for="f-password2" id="label-password2">Confirm new password</label>
      <input type="password" id="f-password2" autocomplete="new-password" required minlength="8" />
    </div>
    <button type="submit" class="btn ok auth-submit" id="confirm-submit"></button>
  </form>

  <div class="auth-links"><a href="login.html" id="back-link"></a></div>
</div>

<script>
(function () {
  const API = '/_dashboard/api/';
  const errorEl = document.getElementById('auth-error');
  const noticeEl = document.getElementById('auth-notice');
  const subEl = document.getElementById('auth-sub');
  const requestForm = document.getElementById('request-form');
  const confirmForm = document.getElementById('confirm-form');

  function showError(msg) { errorEl.textContent = msg; errorEl.classList.add('show'); }
  function showNotice(msg) { noticeEl.textContent = msg; noticeEl.classList.add('show'); }
  function clearMessages() {
    errorEl.classList.remove('show'); noticeEl.classList.remove('show');
  }

  async function api(path, body) {
    const res = await fetch(API + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.success === false) {
      throw new Error(data.error || `request failed (${res.status})`);
    }
    return data;
  }

  const t = AtlasI18n.t;
  const themeBtn = document.getElementById('auth-theme-toggle');
  function renderThemeBtn() {
    const next = AtlasI18n.getTheme() === 'dark' ? 'light' : 'dark';
    const nextLabel = next === 'light' ? t('theme.toggle.toLight') : t('theme.toggle.toDark');
    themeBtn.textContent = nextLabel;
    themeBtn.title = t('theme.toggle.title', { mode: nextLabel });
  }
  themeBtn.addEventListener('click', () => {
    AtlasI18n.setTheme(AtlasI18n.getTheme() === 'dark' ? 'light' : 'dark');
    renderThemeBtn();
  });
  renderThemeBtn();
  const langSelect = document.getElementById('auth-lang-select');
  langSelect.value = AtlasI18n.getLang();
  langSelect.title = t('lang.toggle.title');
  langSelect.addEventListener('change', (ev) => {
    AtlasI18n.setLang(ev.target.value);
    location.reload();
  });

  document.getElementById('auth-brand').textContent = t('auth.brand');
  document.getElementById('label-email').textContent = t('auth.email');
  document.getElementById('label-password').textContent = t('auth.newPassword');
  document.getElementById('label-password2').textContent = t('auth.confirmNewPassword');
  document.getElementById('request-submit').textContent = t('auth.sendResetLink');
  document.getElementById('confirm-submit').textContent = t('auth.setNewPassword');
  document.getElementById('back-link').textContent = t('auth.backToSignIn');
  subEl.textContent = t('auth.resetSub');

  const token = new URLSearchParams(window.location.search).get('token');
  if (token) {
    subEl.textContent = t('auth.resetSubToken');
    requestForm.style.display = 'none';
    confirmForm.style.display = '';
  }

  requestForm.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    clearMessages();
    const email = document.getElementById('f-email').value.trim();
    try {
      const data = await api('password_reset/request', { email });
      showNotice(data.message || t('auth.resetSent'));
      requestForm.reset();
    } catch (e) {
      showError(e.message);
    }
  });

  confirmForm.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    clearMessages();
    const p1 = document.getElementById('f-password').value;
    const p2 = document.getElementById('f-password2').value;
    if (p1 !== p2) { showError(t('auth.passwordsDontMatch')); return; }
    try {
      await api('password_reset/confirm', { token, password: p1 });
      showNotice(t('auth.resetDone'));
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    } catch (e) {
      showError(e.message);
    }
  });
})();
</script>
</body>
</html>
