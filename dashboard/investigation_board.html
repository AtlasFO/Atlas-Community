<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Atlas · Questions</title>
<script>
// The Investigation Board became the Questions view. Preserve deep links.
(() => {
  const u = new URL(window.location.href);
  const target = new URL('questions.html', u);
  const c = u.searchParams.get('case');
  if (c) target.searchParams.set('case', c);
  window.location.replace(target.toString());
})();
</script>
</head>
<body>
<p>Moved to <a href="questions.html">Questions</a>.</p>
</body>
</html>
