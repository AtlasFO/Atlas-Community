[pytest]
testpaths = tests
pythonpath = .
addopts = --cov=core --cov=tools --cov-report=term-missing
asyncio_mode = strict
markers =
    live: Live/integration layer (real tools/evidence/orchestration)
    live_tool: Tool-level live execution
    live_command: CLI/command live tests
    live_evidence: Evidence lifecycle live tests
    live_agent: Scripted agent + real toolbox
    live_e2e: End-to-end scripted investigation smoke
    live_llm: Real LLM Hub calls (expensive, opt-in)
    live_slow: Longer-running live scenarios
    install_smoke: Post-install check install.sh runs by default (seconds, real code paths)
# Live layers are deselected unless --live / ATLAS_LIVE_TESTS=1
# (or -m live…).
